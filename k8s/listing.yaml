apiVersion: apps/v1
kind: Deployment
metadata: { name: listing, namespace: hearth }
spec:
  replicas: 2
  selector: { matchLabels: { app: listing } }
  strategy: { rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }   # zero-downtime deploys
  template:
    metadata: { labels: { app: listing } }
    spec:
      containers:
        - name: listing
          image: hearth/listing:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 50051 }]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: hearth-secrets, key: DATABASE_URL } }
          resources:
            requests: { cpu: 50m, memory: 32Mi }     # scheduler reserves this
            limits: { memory: 128Mi }                # exceeding => OOMKilled
          readinessProbe: { grpc: { port: 50051 }, periodSeconds: 5 }   # gate traffic
          livenessProbe: { grpc: { port: 50051 }, initialDelaySeconds: 10 }  # restart if hung
          securityContext: { runAsNonRoot: true, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false }
---
apiVersion: v1
kind: Service
metadata: { name: listing, namespace: hearth }
spec:
  selector: { app: listing }
  clusterIP: None            # headless: gRPC needs client-side balancing across pod IPs
  ports: [{ port: 50051 }]
