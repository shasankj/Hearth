# TEMPLATE ONLY (not in kustomization.yaml). Create the real Secret out of band, e.g.:
#   kubectl -n hearth create secret generic hearth-secrets \
#     --from-literal=DATABASE_URL='postgres://hearth:<pw>@<rds-endpoint>:5432/hearth?sslmode=require' \
#     --from-literal=JWT_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=JDBC_URL='jdbc:postgresql://<rds-endpoint>:5432/hearth?sslmode=require' \
#     --from-literal=DB_USER=hearth --from-literal=DB_PASSWORD='<pw>'
# In production prefer External Secrets Operator + AWS Secrets Manager (never commit real values).
apiVersion: v1
kind: Secret
metadata: { name: hearth-secrets, namespace: hearth }
type: Opaque
stringData:
  DATABASE_URL: "postgres://hearth:CHANGE_ME@your-rds-endpoint:5432/hearth?sslmode=require"
  JWT_SECRET: "CHANGE_ME_TO_A_LONG_RANDOM_STRING"
  JDBC_URL: "jdbc:postgresql://your-rds-endpoint:5432/hearth?sslmode=require"
  DB_USER: "hearth"
  DB_PASSWORD: "CHANGE_ME"
