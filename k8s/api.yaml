apiVersion: v1
kind: ConfigMap
metadata: { name: api-config, namespace: hearth }
data:
  LISTING_ADDR: "dns:///listing.hearth.svc.cluster.local:50051"
  INSPECTION_URL: "http://inspection.hearth.svc.cluster.local:8081"
  TEMPORAL_ADDRESS: "temporal-frontend.temporal.svc.cluster.local:7233"   # adjust to your Temporal install / Temporal Cloud
  TRUST_PROXY: "true"          # behind the ingress controller
  COOKIE_SECURE: "true"        # requires HTTPS at the ingress (cert-manager)
  NODE_ENV: "production"       # the API refuses to boot with the default JWT secret
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: hearth }
spec:
  replicas: 2
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: hearth/api:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          envFrom: [{ configMapRef: { name: api-config } }]
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: hearth-secrets, key: DATABASE_URL } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: hearth-secrets, key: JWT_SECRET } } }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
          readinessProbe: { httpGet: { path: /healthz, port: 3000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 3000 }, initialDelaySeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: hearth }
spec:
  selector: { app: api }
  ports: [{ port: 80, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: hearth }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: hearth }
spec:
  minAvailable: 1            # node drains can never take down every replica
  selector: { matchLabels: { app: api } }
