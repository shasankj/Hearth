global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor                        # adds X-Forwarded-For so the API sees real client IPs (rate limiting)
    timeout connect 3s
    timeout client  30s
    timeout server  30s
    default-server inter 3s fall 3 rise 2     # health check every 3s; 3 fails = down, 2 passes = up

resolvers docker                                 # Docker's embedded DNS
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend public
    bind *:8080
    unique-id-format %{+X}o\ %ci:%cp_%fi:%fp_%Ts_%rt:%pid
    unique-id-header X-Request-ID              # the Koa requestId middleware reuses this
    acl is_inspection path_beg /inspections
    use_backend inspection if is_inspection
    default_backend api

backend api
    balance roundrobin
    option httpchk GET /healthz
    server api1 api1:3000 check resolvers docker init-addr libc,none
    server api2 api2:3000 check resolvers docker init-addr libc,none

backend inspection
    option httpchk GET /healthz
    server inspection1 inspection:8081 check resolvers docker init-addr libc,none

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
